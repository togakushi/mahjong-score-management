{# Smart sidebar TOC: localtoc first, fallback to global tree #}
{% if display_toc %}
  {% include "localtoc.html" %}
{% else %}
  <h3><a href="{{ pathto(master_doc) }}">{{ _('Table of Contents') }}</a></h3>
  {{ toctree(
      maxdepth=1,
      collapse=False,
      includehidden=True,
      titles_only=True
  ) }}
{% endif %}
